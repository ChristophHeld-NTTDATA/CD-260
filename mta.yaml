_schema-version: 3.3.0
ID: CD260
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: CD260-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      routes:
        - route: "${default-url}"
        - route: "${default-host}.cert.${default-domain}"
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
          srv-cert-url: '${protocol}://${default-host}.cert.${default-domain}'
    requires:
      - name: CD260-connectivity
      - name: CD260-destination
      - name: CD260-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: srv
      - name: CD260-db

  - name: CD260-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: CD260-db
  #- name: CD260-app-deployer
  #  type: com.sap.application.content
  #  path: gen
  #  build-parameters:
  #    build-result: app/
  #    requires:
  #  requires:
  #    - name: srv-api
  #    - name: CD260-html5-repo-host
  #      parameters:
  #        content-target: true
  #        config:
  #          HTML5Runtime_enabled: true
  #          IASDependencyName: CD260-ias-api
resources:
  - name: CD260-ias
    type: org.cloudfoundry.managed-service
    parameters:
      service: identity
      service-name: CD260-ias
      service-plan: application
      config:
        provided-apis:
          - name: CD260-ias-api
            description: API exposed by the application
        display-name: CD260
        oauth2-configuration:
          token-policy:
            access-token-format: "jwt"
        xsuaa-cross-consumption: true
  - name: CD260-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: CD260-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: CD260-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: CD260-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

